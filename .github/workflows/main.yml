name: Publish
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Generate Manifests]
    types: [completed]

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Publish to CDN
        run: |
          eval $(ssh-agent -s)
          ssh-add - <<< "${{ secrets.SERVER_SSH_KEY }}"
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SERVER_PORT }} -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
          ssh -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} exit
